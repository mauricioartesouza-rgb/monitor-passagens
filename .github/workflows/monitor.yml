name: Monitor de passagens

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia às 08:00 (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
    inputs:
      modo:
        description: "O que fazer"
        type: choice
        options: [buscar, testar-telegram, testar-varredura, simular]
        default: buscar

permissions:
  contents: write

concurrency: monitor-passagens

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o monitor
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ inputs.modo || 'buscar' }}
        run: |
          case "$MODO" in
            testar-telegram) python monitor.py --testar-telegram ;;
            testar-varredura) python monitor.py --varredura ;;
            simular)         python monitor.py --simular --telegram ;;
            *)               python monitor.py ;;
          esac

      - name: Salvar histórico de preços
        if: ${{ always() && (inputs.modo || 'buscar') == 'buscar' }}
        run: |
          git config user.name "monitor-passagens"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.json RELATORIO.md || true
          git diff --cached --quiet || git commit -m "Atualiza preços $(date -u +%F)"
          git push
