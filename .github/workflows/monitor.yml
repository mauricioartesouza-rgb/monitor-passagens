name: Monitor de passagens

on:
  schedule:
    - cron: "0 11 * * *"      # busca: todo dia às 08:00 (horário de Brasília)
    - cron: "*/10 * * * *"    # bot: lê suas mensagens no Telegram a cada ~10 min
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
    inputs:
      modo:
        description: "O que fazer"
        type: choice
        options: [buscar, bot, testar-telegram, testar-varredura, simular]
        default: buscar

permissions:
  contents: write

env:
  MODO: ${{ github.event.schedule == '*/10 * * * *' && 'bot' || inputs.modo || 'buscar' }}

# a busca e o bot rodam em filas separadas (um não cancela o outro)
concurrency: monitor-${{ github.event.schedule == '*/10 * * * *' && 'bot' || inputs.modo || 'buscar' }}

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o monitor
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "$MODO" in
            bot)              python monitor.py --bot ;;
            testar-telegram)  python monitor.py --testar-telegram ;;
            testar-varredura) python monitor.py --varredura ;;
            simular)          python monitor.py --simular --telegram ;;
            *)                python monitor.py ;;
          esac

      - name: Salvar viagens e histórico
        if: ${{ always() && (env.MODO == 'buscar' || env.MODO == 'bot') }}
        run: |
          git config user.name "monitor-passagens"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data RELATORIO.md || true
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza $MODO $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
