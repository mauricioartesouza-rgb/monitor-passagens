# =====================================================================
#  CONFIGURAÇÃO DO MONITOR DE PASSAGENS
#  Edite este arquivo direto no GitHub (ícone de lápis) quando quiser
#  mudar duração, passageiros ou metas. Linhas com # são comentários.
# =====================================================================

[geral]
# Quantas buscas no Google Flights (SerpApi) fazer por dia.
# 7 por dia ≈ 210 por mês. O plano grátis da SerpApi dá 250.
buscas_por_execucao = 7

# Só considera viagens com volta até esse número de dias a partir de hoje
# (as companhias ainda não vendem datas mais distantes).
dias_max_antecedencia = 300

# Quantas buscas de uma viagem o robô precisa ter feito antes de
# avisar "novo menor preço histórico" (evita avisos no começo).
observacoes_antes_de_alertar = 10

# Não confere de novo no Google a mesma data antes desse número de dias.
reconferir_apos_dias = 3

# Dia do resumo semanal no Telegram: 0=segunda ... 6=domingo, -1 desliga.
dia_resumo_semanal = 0


# ---------------------------------------------------------------------
#  VIAGENS
#  dias_min / dias_max = duração da viagem (noites entre ida e volta)
#  meses       = (opcional) limita a ida a esses meses, ex.: [2, 3, 4]
#                sem essa linha, vale qualquer mês do ano
#  preco_alvo  = (opcional) avisa quando o TOTAL ficar abaixo disso, em R$
#  Passageiros: criancas = 2 a 11 anos (paga assento)
#               bebes_colo = menos de 2 anos, no colo
#               bebes_assento = menos de 2 anos, com assento próprio
# ---------------------------------------------------------------------

[[viagens]]
id = "orlando"
nome = "Orlando"
origem = "GRU"
destino = "MCO"
dias_min = 11
dias_max = 16
ativa = true
historico_antigo = ["orlando-2027", "orlando-2028"]
# preco_alvo = 15000
[viagens.passageiros]
adultos = 2
criancas = 1
bebes_colo = 0
bebes_assento = 0

