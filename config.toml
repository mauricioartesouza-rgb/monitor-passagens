destino = "BRC"
ano = 2027
meses = [9]                # setembro
dias = 12
passo_dias = 2
ativa = true
# preco_alvo = 9000
[viagens.passageiros]
adultos = 2
criancas = 1               # filho com 3 anos
bebes_colo = 1             # bebê nascido em junho/2027 (~3 meses)
bebes_assento = 0

